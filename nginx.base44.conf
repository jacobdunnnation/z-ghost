server {
    listen 3000;
    server_name _;
    root /app;
    index ghostlinksinglefile.html;

    # Always allow the preview origin and sandbox host
    add_header Access-Control-Allow-Origin *;

    location / {
        try_files $uri $uri/ /ghostlinksinglefile.html;
    }

    # Don't cache HTML so edits show on refresh
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
